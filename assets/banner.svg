<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: url(#textGrad);
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .tag {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .pulse-circle {
      animation: pulse 3s infinite alternate ease-in-out;
    }
    .float-card {
      animation: float 4s infinite alternate ease-in-out;
    }
    .dash-line {
      stroke-dasharray: 8 8;
      animation: dash 20s linear infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.3; }
      100% { transform: scale(1.15); opacity: 0.6; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-10px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -100; }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)"/>
  <rect width="1196" height="296" x="2" y="2" rx="14" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Dynamic / Animated Background Elements (Positioned away from center text) -->
  <g opacity="0.4">
    <circle cx="150" cy="80" r="60" fill="#0284c7" filter="url(#glow)" class="pulse-circle"/>
    <circle cx="1050" cy="220" r="70" fill="#059669" filter="url(#glow)" class="pulse-circle" style="animation-delay: -1.5s;"/>
  </g>

  <!-- Flow & Network Lines in Background -->
  <path d="M 50 240 Q 200 180 350 250 T 650 220 T 950 260 T 1150 200" fill="none" stroke="#0284c7" stroke-width="2" opacity="0.3" class="dash-line"/>
  <path d="M 50 60 Q 250 120 500 50 T 850 80 T 1150 40" fill="none" stroke="#10b981" stroke-width="2" opacity="0.25" class="dash-line" style="animation-duration: 15s;"/>

  <!-- Background Info Cards (Side elements) -->
  <g class="float-card" transform="translate(60, 140)">
    <rect width="160" height="75" rx="10" fill="url(#cardGrad)" stroke="#0284c7" stroke-width="1.5"/>
    <text x="15" y="30" class="tag" fill="#38bdf8">🛡️ HACCP Plans</text>
    <text x="15" y="55" font-family="sans-serif" font-size="11" fill="#64748b">Digital Verification</text>
  </g>

  <g class="float-card" transform="translate(980, 70)" style="animation-delay: -2s;">
    <rect width="160" height="75" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5"/>
    <text x="15" y="30" class="tag" fill="#34d399">🌡️ Sensor IoT</text>
    <text x="15" y="55" font-family="sans-serif" font-size="11" fill="#64748b">Cold Chain Tracking</text>
  </g>

  <!-- FOREGROUND CONTENT: Header & Title & Subtitle (Guaranteed readable & unobstructed) -->
  <g text-anchor="middle">
    <!-- Center Shield Icon -->
    <g transform="translate(600, 52)">
      <path d="M 0 -22 L 20 -10 V 10 Q 0 25 -20 10 V -10 Z" fill="#10b981" opacity="0.2"/>
      <path d="M 0 -18 L 16 -8 V 8 Q 0 20 -16 8 V -8 Z" fill="none" stroke="#34d399" stroke-width="2"/>
      <path d="M -6 0 L -1 5 L 7 -4" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Main Title -->
    <text x="600" y="135" class="title">Awesome Food Safety &amp; HACCP</text>
    
    <!-- Subtitle -->
    <text x="600" y="175" class="subtitle">Curated SaaS Platforms, Open-Source Repositories &amp; IoT Compliance Ecosystem</text>

    <!-- Feature Pill Tags -->
    <g transform="translate(600, 225)">
      <!-- Pill 1 -->
      <g transform="translate(-240, 0)">
        <rect x="-70" y="-16" width="140" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
        <text y="5" class="tag" text-anchor="middle">📋 Digital Audits</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(0, 0)">
        <rect x="-75" y="-16" width="150" height="32" rx="16" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
        <text y="5" class="tag" text-anchor="middle">⚡ Real-time Alerts</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(240, 0)">
        <rect x="-80" y="-16" width="160" height="32" rx="16" fill="#1e293b" stroke="#a78bfa" stroke-width="1"/>
        <text y="5" class="tag" text-anchor="middle">🔬 Traceability &amp; QC</text>
      </g>
    </g>
  </g>
</svg>
